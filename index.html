<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Editable HTML · 演示</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/layout.css">
<style>
  /* 演示外壳（chrome）—— 同样只用 tokens 变量 */
  html,body{margin:0;height:100%;background:var(--canvas);font-family:var(--font-sans)}
  .wrap{height:100%;display:grid;grid-template-rows:auto 1fr}
  .bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
  .bar .t{font-weight:800;font-size:var(--fs-3)}
  .bar .sp{flex:1}
  .bar button{font:inherit;font-size:var(--fs-2);font-weight:700;cursor:pointer;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:var(--r-md)}
  .bar button:hover{border-color:var(--accent);color:var(--accent)}
  .bar button.edit{background:var(--accent);border-color:var(--accent);color:var(--paper)}
  .stage{overflow:auto;padding:24px;display:grid;place-items:start center}
  iframe{width:1280px;height:720px;border:0;background:var(--paper);
    box-shadow:0 8px 30px rgba(0,0,0,.10);border-radius:var(--r-sm);transition:width .2s,height .2s}
  /* 编辑模式：iframe 撑满可用区域，否则右侧属性面板会被 iframe 高度截断 */
  body[data-editing] .stage{padding:0;place-items:start stretch}
  body[data-editing] iframe{width:100%;height:calc(100vh - 53px);box-shadow:none;border-radius:0}
  .hint{font-size:var(--fs-2);color:var(--ink-3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span class="t">Editable HTML · 演示</span>
    <span class="hint" id="nav">1 / 3</span>
    <span class="sp"></span>
    <button id="prev">← 上一页</button>
    <button id="next">下一页 →</button>
    <button class="edit" id="edit">进入编辑模式</button>
  </div>
  <div class="stage"><iframe id="f" src="slides/01-cover.html" title="slide"></iframe></div>
</div>
<script>
var slides=['slides/01-cover.html','slides/02-why.html','slides/03-new.html'], i=0, editing=false;
var f=document.getElementById('f'), nav=document.getElementById('nav');
function render(){
  document.body.setAttribute('data-editing', editing ? '1' : '0');
  f.src = slides[i] + (editing ? '?edit=1' : '');
  nav.textContent = (i+1)+' / '+slides.length;
}
document.getElementById('prev').onclick=function(){ i=(i-1+slides.length)%slides.length; render(); };
document.getElementById('next').onclick=function(){ i=(i+1)%slides.length; render(); };
document.getElementById('edit').onclick=function(){
  editing=!editing;
  this.textContent = editing ? '退出编辑模式' : '进入编辑模式';
  render();
};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight') document.getElementById('next').click();
  if(e.key==='ArrowLeft') document.getElementById('prev').click();
});
render();
</script>
</body>
</html>
